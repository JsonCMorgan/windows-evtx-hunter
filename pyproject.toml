[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-evtx-hunter"
version = "0.1.0"
description = "Parse Windows EVTX and flag SOC-relevant events with HTML timeline (portfolio #6)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["python-evtx>=0.7.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evtx-hunter = "evtx_hunter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]